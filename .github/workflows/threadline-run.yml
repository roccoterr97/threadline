# Runs Threadline on GitHub Actions: the daily run, and the dashboard's
# "Refresh now". It runs on YOUR Claude subscription, through the key that
# `claude setup-token` makes, stored as the CLAUDE_CODE_OAUTH_TOKEN secret.
#
# Without the required secrets (the public template, a copy not set up yet)
# every run finishes green and does nothing.
#
# The dashboard's "Refresh now" starts this workflow through GitHub's API by
# its file name, threadline-run.yml, with the input mode=refresh. Keep both.
#
# GitHub often starts the schedule below hours late. Once the on-time morning
# start is switched on (`uv run tracker setup refresh`), your Supabase
# database starts the daily run at its time, through the same API with
# mode=daily, and the schedule below is only the backup: its gate stops when
# the day's run has already started. Guide: docs/refresh-now.md.
#
# Set-up: `uv run tracker setup schedule` writes the daily time below;
# `uv run tracker setup github` fills in the secrets and variables.
# Guide: docs/setup-your-accounts.md, "Run it every day on GitHub".

name: Threadline run

# The title each run shows on GitHub. The gate below tells the two kinds of run
# apart by it, so keep both titles as they are.
run-name: ${{ inputs.mode == 'refresh' && 'Threadline refresh' || 'Threadline daily run' }}

on:
  schedule:
    # The daily time. 'uv run tracker setup schedule' rewrites these two lines.
    - cron: "0 7 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily: the whole run with the summary e-mail. refresh: new messages only, no e-mail."
        type: choice
        options:
          - daily
          - refresh
        default: daily

# actions: read lets the gate see whether the other kind of run is going.
permissions:
  contents: read
  actions: read

# Daily runs and refreshes queue separately. GitHub keeps one waiting run per
# group and drops an older waiting one for a newer, so with one shared group a
# refresh pressed while a refresh was running would have dropped the daily run
# waiting behind it. Now a newer refresh can only replace an older refresh, and
# two daily runs, or two refreshes, still never overlap. A daily run and a
# refresh take turns in the gate: the daily run waits for a refresh that is
# going, and a refresh that finds the daily run going stops, since the daily
# run reads everything new anyway. When GitHub cannot say what is going, even
# after a few tries, a refresh stops, and the daily run keeps asking and goes
# ahead once its wait is up: a refresh can be pressed again, a skipped morning
# cannot be had back.
concurrency:
  group: threadline-${{ inputs.mode == 'refresh' && 'refresh' || 'daily' }}
  cancel-in-progress: false

jobs:
  run:
    name: Threadline
    runs-on: ubuntu-latest
    # A refresh: under 2 minutes asking GitHub what is going, then setting up,
    # then the recipe's 45 at most (50).
    # A daily run may first wait out a whole refresh: 55 minutes (50 plus a
    # margin for GitHub to mark it finished), plus one last look of under 3,
    # then the refresh's 50 again, about 108 in all; 120 leaves time to spare.
    timeout-minutes: ${{ inputs.mode == 'refresh' && 50 || 120 }}
    steps:
      # Decides whether to run at all, and in which mode, then takes turns with
      # the other kind of run. Prints names only, never a value.
      - name: Check the set-up
        id: gate
        env:
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          OWNER_TIME_ZONE: ${{ vars.OWNER_TIME_ZONE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OWNER_EMAIL_ADDRESSES: ${{ secrets.OWNER_EMAIL_ADDRESSES }}
        run: |
          missing=""
          for name in CLAUDE_CODE_OAUTH_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY TOKEN_ENCRYPTION_KEY OWNER_EMAIL_ADDRESSES; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Threadline is not set up in this repository, so there is nothing to do. Missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${MODE:-daily}" in
            daily) trigger=github ;;
            refresh) trigger=refresh ;;
            *) echo "::error::mode must be daily or refresh"; exit 1 ;;
          esac
          # How many other runs with this title are going, or "unknown" when
          # GitHub cannot say after a few tries. An error, a lookup that hangs
          # (cut off after 30 seconds) or an answer that is not a number is
          # never read as 0. At most 3 x 30 + 2 x 10 seconds: under 2 minutes.
          lookup_attempts=3
          lookup_pause_seconds=10
          lookup_timeout_seconds=30
          # Runs read when looking for today's daily run: one daily run and a
          # few dozen refreshes a day at most.
          runs_read_limit=100
          # count_runs FILTER [gh options]: how many other runs match a jq
          # condition, asked the way described above.
          count_runs() {
            local filter=$1 attempt count
            shift
            for attempt in $(seq "$lookup_attempts"); do
              if count=$(timeout "$lookup_timeout_seconds" gh run list --workflow threadline-run.yml \
                "$@" --json databaseId,displayTitle,status,conclusion,createdAt \
                --jq "[.[] | select(.databaseId != $RUN_ID) | select($filter)] | length") \
                && [[ "$count" =~ ^[0-9]+$ ]]; then
                echo "$count"
                return 0
              fi
              if [ "$attempt" -lt "$lookup_attempts" ]; then sleep "$lookup_pause_seconds"; fi
            done
            echo unknown
          }
          going() {
            count_runs ".displayTitle == \"$1\"" --status in_progress
          }
          # Daily runs created on the owner's today that are waiting, going or
          # finished well (a failed or cancelled one does not count). Each run's
          # time is moved by the zone's offset from UTC now, so this needs no
          # date arithmetic that differs between machines.
          daily_runs_today() {
            local zone=$1 today offset sign
            today=$(TZ="$zone" date +%F)
            offset=$(TZ="$zone" date +%z)
            sign=1
            if [ "${offset:0:1}" = "-" ]; then sign=-1; fi
            offset=$((sign * (10#${offset:1:2} * 3600 + 10#${offset:3:2} * 60)))
            count_runs ".displayTitle == \"Threadline daily run\" and (.status != \"completed\" or .conclusion == \"success\") and ((((.createdAt | fromdateiso8601) + ($offset)) | strftime(\"%Y-%m-%d\")) == \"$today\")" \
              --limit "$runs_read_limit"
          }
          if [ "$trigger" = refresh ]; then
            daily=$(going 'Threadline daily run')
            if [ "$daily" = unknown ]; then
              echo "::notice::GitHub could not say whether the daily run is going, so this refresh stops here rather than risk running beside it. Press Refresh now again in a few minutes."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$daily" -gt 0 ]; then
              echo "::notice::The daily run is going and reads everything new, so this refresh stops here."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # GitHub's own schedule is the backup for the on-time morning start,
          # which normally started the day's run from Supabase hours earlier.
          # A scheduled run therefore stops when a daily run of the owner's
          # day already started. Not knowing is not "nothing started": it goes
          # ahead, and no second summary e-mail goes out on the same day.
          # A daily run started by hand or by Supabase always goes ahead.
          if [ "$trigger" = github ] && [ "$EVENT" = schedule ]; then
            started=$(daily_runs_today "${OWNER_TIME_ZONE:-UTC}")
            if [ "$started" = unknown ]; then
              echo "::notice::GitHub could not say whether today's daily run already started, so this scheduled run goes ahead. No second summary e-mail goes out today."
            elif [ "$started" -gt 0 ]; then
              echo "::notice::Today's daily run already started on time, so GitHub's own later start stops here. Nothing is wrong."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$trigger" = github ]; then
            # A refresh is stopped by GitHub after 50 minutes (the job timeout
            # above); 55 leaves GitHub time to mark it finished. Look every 30
            # seconds. The clock is bash's own SECONDS, so the time each lookup
            # takes counts too. Not knowing is not "nothing is going": the daily
            # run keeps asking, and goes ahead only at the limit, never skipping
            # the morning.
            wait_limit_seconds=3300
            poll_seconds=30
            waiting_since=$SECONDS
            while true; do
              refreshes=$(going 'Threadline refresh')
              if [ "$refreshes" = 0 ]; then break; fi
              if [ $((SECONDS - waiting_since)) -ge "$wait_limit_seconds" ]; then
                if [ "$refreshes" = unknown ]; then
                  echo "::warning::GitHub could not say whether a refresh is going, even after $((wait_limit_seconds / 60)) minutes of asking, so the daily run goes ahead rather than skip the morning."
                else
                  echo "::warning::A refresh still looked busy after $((wait_limit_seconds / 60)) minutes, so the daily run goes ahead."
                fi
                break
              fi
              if [ "$refreshes" = unknown ]; then
                echo "GitHub could not say whether a refresh is going; asking again."
              else
                echo "A refresh is going; waiting for it to finish."
              fi
              sleep "$poll_seconds"
            done
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE:-daily}" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"

      - name: Check out the project
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5

      # uv installs the Python version named in backend/.python-version.
      # setup-uv publishes no moving major tag since v8, so it is pinned to the
      # commit of one release, as GitHub advises for any action; v10 runs on
      # Node.js 24 (v6 ran on the retired Node.js 20).
      - name: Install uv
        if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Threadline
        if: steps.gate.outputs.ready == 'true'
        working-directory: backend
        run: uv sync --locked

      # The recipe in .claude/commands/daily-run.md, with the permissions in
      # .claude/settings.json. GitHub's own short-lived token is passed, so no
      # Claude GitHub App is needed. The settings reach this step only.
      - name: Run the recipe with Claude
        id: claude
        if: steps.gate.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 45
        # Every setting Threadline reads, in one place. Secrets are hidden in
        # the log by GitHub; variables are the settings that are neither secret
        # nor personal. backend/src/tracker/shared/constants/github.py says
        # which is which, and a test keeps this list and that file in step.
        env:
          APP_ENV: production
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OWNER_LINKEDIN_PROFILE_URL: ${{ secrets.OWNER_LINKEDIN_PROFILE_URL }}
          OWNER_EMAIL_ADDRESSES: ${{ secrets.OWNER_EMAIL_ADDRESSES }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_TOKEN_EXPIRES_ON: ${{ vars.LINKEDIN_TOKEN_EXPIRES_ON }}
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          SUMMARY_RECIPIENT: ${{ secrets.SUMMARY_RECIPIENT }}
          OWNER_DISPLAY_NAME: ${{ secrets.OWNER_DISPLAY_NAME }}
          OWNER_TIME_ZONE: ${{ vars.OWNER_TIME_ZONE }}
          OWNER_WEEKEND_DAYS: ${{ vars.OWNER_WEEKEND_DAYS }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          SUMMARY_SUBJECT_PREFIX: ${{ vars.SUMMARY_SUBJECT_PREFIX }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT: ${{ vars.MICROSOFT_TENANT }}
          MAIL_SOURCES: ${{ vars.MAIL_SOURCES }}
          IMAP_PROVIDER: ${{ vars.IMAP_PROVIDER }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          SUMMARY_DELIVERY: ${{ vars.SUMMARY_DELIVERY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .claude/settings.json
          prompt: /daily-run --trigger ${{ steps.gate.outputs.trigger }} --mode ${{ steps.gate.outputs.mode }}
          # The same permissions as .claude/settings.json, passed explicitly:
          # the action does not always apply the project's allow list, and the
          # assessment needs the Skill and Agent tools to start its helpers.
          # Writing is allowed in work/ only, where the assessor leaves its
          # verdict files. Everything else in the repository is refused as
          # well, so a hostile message that talks the assessor into writing
          # code or settings (which the next command would run with the
          # secrets in its environment) finds nothing it may write.
          claude_args: >-
            --max-turns 200
            --allowedTools "Bash(cd:*),Bash(uv run tracker:*),Bash(mkdir:*),Read,Edit(/work/**),Skill,Task,Agent"
            --disallowedTools "Edit(/backend/**),Edit(/frontend/**),Edit(/website/**),Edit(/supabase/**),Edit(/docs/**),Edit(/profile/**),Edit(/.claude/**),Edit(/.github/**),Edit(/.*),Edit(/*.md),Edit(/LICENSE),Edit(/install.sh),Edit(/install.ps1)"

      # The action hides what Claude wrote, since it can quote your mail, and so
      # also hides why Claude stopped. When Claude stopped with an error, this
      # reads the reason from the action's record of the run and says it in one
      # plain line, with what to do, here and on the run's summary page. It
      # never prints what Claude wrote. The set-up looks for the line's title
      # (CLAUDE_STOPPED_TITLE in backend/src/tracker/shared/constants/claude.py)
      # when it watches the first run.
      - name: Say why Claude stopped
        if: failure() && steps.claude.outcome == 'failure'
        working-directory: backend
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if ! reason=$(uv run tracker run why-claude-stopped "$EXECUTION_FILE"); then
            reason="Claude stopped with an error, and the reason could not be read."
          fi
          echo "::error title=Why Claude stopped::$reason"
          echo "**Why Claude stopped:** $reason" >> "$GITHUB_STEP_SUMMARY"
